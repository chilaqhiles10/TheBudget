<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>מסיבת הסיום — סימולטור התקציב</title>
<style>
:root{font-family:Arial,'Helvetica Neue',sans-serif;color:#202124;background:#f7f8fa}*{box-sizing:border-box}body{margin:0;padding:28px 16px}.wrap{max-width:850px;margin:auto}h1{font-size:clamp(25px,4vw,37px);margin:0 0 10px}p{color:#555;line-height:1.65}.panel{background:#fff;border:1px solid #dedfe3;border-radius:19px;padding:25px;margin-top:22px;box-shadow:0 5px 20px #00000008}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.budget{font-size:31px;font-weight:750;margin:5px 0}.muted{color:#777}.status{font-size:14px;border-radius:30px;padding:9px 14px;background:#e6f5ee;color:#12613d;font-weight:bold}.status.bad{background:#ffe5e5;color:#b51d25}.bar{height:12px;background:#e8eaed;border-radius:30px;overflow:hidden;margin:22px 0 6px}.fill{height:100%;background:#21885c;width:0;transition:width .2s}.fill.bad{background:#e04848}fieldset{border:0;border-bottom:1px solid #e6e7ea;padding:24px 0;margin:0}legend{font-size:20px;font-weight:700;padding:0 0 12px}.choice{display:flex;align-items:center;gap:14px;min-height:55px;padding:10px 13px;border:1px solid transparent;border-radius:11px;cursor:pointer}.choice:hover{background:#f5f7fa}.choice:has(input:checked){background:#f1f7f4;border-color:#d2e8dc}.choice input{width:21px;height:21px;accent-color:#1c7853;cursor:pointer;flex:none}.name{flex:1}.price{font-variant-numeric:tabular-nums;color:#555;white-space:nowrap}.summary{background:#f5f7f8;padding:18px;border-radius:13px;margin-top:24px}.line{display:flex;justify-content:space-between;margin:10px 0}.line strong{font-size:20px}button{border:0;background:#176b4b;color:#fff;font-size:16px;font-weight:bold;border-radius:10px;padding:13px 18px;cursor:pointer}button.secondary{background:#e8ebee;color:#24272b}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.note{font-size:13px;color:#6c7075}#result{white-space:pre-line;margin-top:12px;color:#1b6748} @media(max-width:520px){.panel{padding:17px}.top{align-items:flex-start}.budget{font-size:25px}.choice{gap:9px}.status{font-size:12px}}
</style>
</head>
<body><main class="wrap">
<h1>מסיבת הסיום — סימולטור התקציב</h1>
<p>אתם מתכננים את מסיבת הסיום של השנה הרביעית. בחרו אפשרות אחת מכל קטגוריה. התקציב הכולל הוא <b>¥6,000</b>, ועליכם להגיע להסכמה קבוצתית.</p>
<section class="panel">
<div class="top"><div><div class="muted">התקציב שנותר</div><div class="budget" id="remaining">¥6,000</div></div><span class="status" id="status">בתוך התקציב</span></div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="categories"></div>
<div class="summary"><div class="line"><span>סך ההוצאות</span><strong id="total">¥0</strong></div><div class="line"><span>יתרה</span><strong id="balance">¥6,000</strong></div></div>
<div class="actions"><button id="copy">העתקת התוכנית</button><button class="secondary" id="reset">איפוס הבחירות</button></div>
<div id="result" role="status" aria-live="polite"></div>
<p class="note">כל המחירים הם סכומים מדומים לצורך המשחק. אם חרגתם מהתקציב, עליכם לשנות את הבחירות.</p>
</section></main>
<script>
const budget=6000;
const categories=[
{name:'מקום',options:[['כיתה באוניברסיטה',0],['חדר פרטי במסעדה',1200],['אולם אירועים',2200]]},
{name:'אוכל',options:[['חטיפים ושתייה',400],['ארוחה פשוטה',1200],['ארוחה חגיגית',2000]]},
{name:'פעילות',options:[['משחקי חברה',0],['קריוקי',500],['הופעה ופעילות מיוחדת',1300]]},
{name:'מתנות סיום',options:[['כרטיסי ברכה אישיים',200],['אלבום תמונות',900],['מתנה אישית לכל סטודנט',1800]]},
{name:'תיעוד וזיכרונות',options:[['תמונות בטלפונים',0],['צלם מקצועי',700],['סרט סיום ערוך',1200]]}
];
const money=n=>'¥'+n.toLocaleString('en-US');
const area=document.getElementById('categories');
function render(){area.innerHTML=categories.map((cat,i)=>`<fieldset><legend>${cat.name}</legend>${cat.options.map(([label,price],j)=>`<label class="choice"><input type="radio" name="category${i}" value="${j}" ${j===0?'checked':''}><span class="name">${label}</span><span class="price">${money(price)}</span></label>`).join('')}</fieldset>`).join('');area.addEventListener('change',update);update()}
function selections(){return categories.map((c,i)=>{const chosen=document.querySelector(`input[name="category${i}"]:checked`);return {name:c.name,choice:c.options[Number(chosen.value)]}})}
function update(){const spent=selections().reduce((sum,s)=>sum+s.choice[1],0),remaining=budget-spent;document.getElementById('remaining').textContent=money(remaining);document.getElementById('total').textContent=money(spent);document.getElementById('balance').textContent=money(remaining);const status=document.getElementById('status');status.textContent=remaining<0?'חריגה מהתקציב':'בתוך התקציב';status.classList.toggle('bad',remaining<0);const fill=document.getElementById('fill');fill.style.width=Math.min(100,spent/budget*100)+'%';fill.classList.toggle('bad',remaining<0);document.getElementById('result').textContent=''}
document.getElementById('reset').addEventListener('click',()=>{document.querySelectorAll('fieldset').forEach(f=>f.querySelector('input').checked=true);update()});
document.getElementById('copy').addEventListener('click',async()=>{const s=selections(),spent=s.reduce((sum,x)=>sum+x.choice[1],0),remaining=budget-spent;if(remaining<0){document.getElementById('result').textContent='יש חריגה מהתקציב. תקנו את הבחירות לפני ההעתקה.';return}const txt='תוכנית מסיבת הסיום\n'+s.map(x=>`${x.name}: ${x.choice[0]} — ${money(x.choice[1])}`).join('\n')+`\nסה״כ: ${money(spent)}\nיתרה: ${money(remaining)}`;try{await navigator.clipboard.writeText(txt);document.getElementById('result').textContent='התוכנית הועתקה.'}catch(e){const box=document.getElementById('result');box.textContent=txt+'\n(אפשר לסמן ולהעתיק את הטקסט.)'}});
render();
</script></body></html>
